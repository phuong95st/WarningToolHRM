# ===================================================================
# HRM Attendance Warning Tool Configuration
# ===================================================================

# HRM Web Configuration
hrm.url=http://hrm.gm-group.vn
hrm.api.attendance.path=/api/attendance/today
hrm.api.holidays.path=/api/holidays
hrm.api.notifications.path=/api/notifications/mine

# Microsoft SSO Login Credentials
microsoft.username=phuongnh@gm-group.vn
microsoft.password=Goq67197

# Browser Automation (Playwright)
# channel can be 'msedge', 'chrome', or empty (uses default bundled chromium)
browser.channel=msedge
browser.headless=true
browser.user.data.dir=./playwright_profile

# Telegram Notification Settings
telegram.enabled=true
telegram.bot.token=
telegram.chat.id=

# Work Schedule (Flexible Hours)
# Standard 8h work + 1h lunch = 9 hours total span
work.flexible.earliest.start=08:30
work.flexible.latest.start=09:00
work.required.span.hours=9

# Morning reminder times if not checked in (HH:mm separated by comma)
reminders.morning=08:30,08:45,08:55

# Evening reminder times if not checked out (HH:mm separated by comma)
reminders.evening=17:35,18:05,18:30,19:00,20:00

# Periodic Check Interval (in minutes) during work hours
check.interval.minutes=2

# Log retention days (auto-clean older logs)
log.retention.days=30
